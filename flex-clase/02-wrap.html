<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flex</title>
</head>
<body>
    <h1> Wrap</h1>
    <div style="display: flex; flex-wrap: wrap; width: 50%;background-color: bisque;">
        <div style="background-color: red; padding: 20px; margin: 5px;flex-basis: 200px;">1</div>
        <div style="background-color: green; padding: 20px; margin: 5px;flex-basis: 200px;">2</div>
        <div style="background-color: blue; padding: 20px; margin: 5px;flex-basis: 200px;">3</div>
    </div>      
</body>
</html>
