<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flex</title>
</head>
<body>
    <h1> align-self</h1>
    <div style="display: flex; height: 200px; background-color: #f0f0f0;">
        <div style="background-color: red; padding: 20px; margin: 5px;align-self: flex-start;">1</div>
        <div style="background-color: green; padding: 20px; margin: 5px; align-self: center;">2</div>
        <div style="background-color: blue; padding: 20px; margin: 5px;align-self: flex-end;">3</div>
      </div>      
      
      
</body>
</html>
