<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flex</title>
</head>
<body>
    <h1> flex-shrink</h1>
    <div style="display: flex; width: 25%;background-color: bisque;height: 100px;">
        <div style="background-color: red; flex-basis: 100px;margin: 5px;  flex-shrink: 1;">A</div>
        <div style="background-color: green; flex-basis: 100px;margin: 5px;  flex-shrink: 2;">B</div>
        <div style="background-color: blue; flex-basis: 100px;margin: 5px;  flex-shrink: 3;">C</div>
      </div>
      
</body>
</html>
