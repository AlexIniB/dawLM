<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flex</title>
</head>
<body>
    <h1> flex-grow</h1>
    <div style="display: flex;background-color: bisque;">
        <div style="background-color: red; padding: 20px; margin: 5px; flex-grow: 1;">1</div>
        <div style="background-color: green; padding: 20px; margin: 5px; flex-grow: 2;">2</div>
        <div style="background-color: blue; padding: 20px; margin: 5px; flex-grow: 1;">3</div>
      </div>      
</body>
</html>
